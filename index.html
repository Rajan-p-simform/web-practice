<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Free 5-Card Tarot Message</title>
<meta name="description" content="Pick 5 cards and receive your free personalized tarot message.">
<style>
  :root{--bg:#0b0718;--gold:#e9c46a;--text:#f3ecff;--muted:#a99cc4;--btn:#f2b134;--btn-dark:#d9921a}
  *{box-sizing:border-box}
  html,body{margin:0}
  html{background:var(--bg)}
  body{min-height:100vh;background:radial-gradient(ellipse at top,#2a1650 0%,var(--bg) 60%);color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;
    padding:28px 16px 20px;text-align:center}
  main{width:100%;max-width:520px;flex:1}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:normal;color:var(--gold);font-size:clamp(26px,6.5vw,38px);line-height:1.2;margin:0 0 10px}
  .sub{color:var(--muted);font-size:17px;margin:0 0 22px}
  .media{position:relative;display:block;border-radius:16px;overflow:hidden;border:1px solid rgba(233,196,106,.35);
    box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .media svg{display:block;width:100%;height:auto}
  .play{position:absolute;top:50%;left:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;
    background:rgba(242,177,52,.95);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 10px rgba(242,177,52,.25);animation:pulse 1.8s infinite}
  .play::after{content:"";margin-left:7px;border-style:solid;border-width:16px 0 16px 26px;border-color:transparent transparent transparent #1a0f33}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 8px rgba(242,177,52,.25)}50%{box-shadow:0 0 0 18px rgba(242,177,52,.08)}}
  .btn{display:block;margin:24px 0 10px;padding:18px 20px;border-radius:12px;background:var(--btn);color:#1a0f33;
    font-size:20px;font-weight:700;text-decoration:none;box-shadow:0 5px 0 var(--btn-dark)}
  .btn:hover{background:#ffc24d}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--btn-dark)}
  .note{color:var(--muted);font-size:14px;margin:0}</style>
</head>
<body>
<main>
  <h1>These 5 Cards Hold a Message Meant for You</h1>
  <p class="sub">Choose your cards and get your free tarot reading.</p>

  <a class="media cta" href="https://460b8h1noqjvcs550apgoqyqff.hop.clickbank.net/?&amp;traffic_source=pin" rel="nofollow sponsored" aria-label="Start my free tarot reading">
    <svg viewBox="0 0 600 400" role="img" aria-hidden="true">
      <defs>
        <radialGradient id="sky" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#3a1f6e"/><stop offset="1" stop-color="#0d0820"/></radialGradient>
        <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1a55"/><stop offset="1" stop-color="#140c2e"/></linearGradient>
      </defs>
      <rect width="600" height="400" fill="url(#sky)"/>
      <g fill="#fff" opacity=".7">
        <circle cx="60" cy="50" r="1.6"/><circle cx="140" cy="110" r="1.2"/><circle cx="520" cy="70" r="1.8"/><circle cx="470" cy="140" r="1.1"/>
        <circle cx="90" cy="330" r="1.4"/><circle cx="540" cy="320" r="1.5"/><circle cx="300" cy="40" r="1.2"/><circle cx="380" cy="360" r="1"/>
      </g>
      <g transform="translate(300 360)" stroke="#e9c46a" stroke-width="2.5">
        <g transform="rotate(-36)"><rect x="-55" y="-250" width="110" height="180" rx="10" fill="url(#card)"/></g>
        <g transform="rotate(-18)"><rect x="-55" y="-250" width="110" height="180" rx="10" fill="url(#card)"/></g>
        <g transform="rotate(18)"><rect x="-55" y="-250" width="110" height="180" rx="10" fill="url(#card)"/></g>
        <g transform="rotate(36)"><rect x="-55" y="-250" width="110" height="180" rx="10" fill="url(#card)"/></g>
        <g><rect x="-55" y="-250" width="110" height="180" rx="10" fill="url(#card)"/>
          <circle cx="0" cy="-160" r="30" fill="none" stroke-width="1.5"/></g>
      </g>
    </svg>
    <span class="play"></span>
  </a>

  <a class="btn cta" href="https://460b8h1noqjvcs550apgoqyqff.hop.clickbank.net/?&amp;traffic_source=pin" rel="nofollow sponsored">Start My Free Reading &rarr;</a>
  <p class="note">Free reading &middot; Opens on the next page</p>
</main>
</body>
</html>
